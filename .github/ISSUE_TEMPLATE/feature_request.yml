name: Feature request
description: An idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation behind the idea.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you imagine it working. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Optional. Workarounds, how other tools do it, your setup.
