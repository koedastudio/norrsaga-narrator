[project]
name = "norrsaga-narrator"
version = "0.1.0"
description = "Just-in-time TTS sidecar for Audiobookshelf: streams ebooks as HLS audio via Kokoro"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "ebooklib>=0.19",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "pysbd>=0.3.4",
    "pydantic-settings>=2.7",
]

[project.urls]
Repository = "https://github.com/koedastudio/norrsaga-narrator"
Issues = "https://github.com/koedastudio/norrsaga-narrator/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::SyntaxWarning",  # pysbd ships regexes with unescaped sequences
    "ignore::bs4.XMLParsedAsHTMLWarning",  # lenient epub parsing is deliberate
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
